[appearance]
mode = "dark"
nova_design = false

[window]
close_with_last_tab = true
quit_shortcut = "quit"

[startup]
open = "last_session"

[privacy]
fingerprinting = "protect"
clear_on_quit = false

[extensions]
istilldontcareaboutcookies = "idcac-pub@guus.ninja"
noscript = "{73a6fe31-595d-460b-a920-fcc0f8843232}"
sponsorblock = "sponsorBlocker@ajay.app"
ublock-origin = "uBlock0@raymondhill.net"

[tabs]
vertical = true

[sidebar]
tools = []

[toolbar]
buttons = ["back", "forward", "reload", "space", "address_bar", "space", "downloads", "extensions", "menu"]

[bookmarks_toolbar]
show = "never"

[address_bar]
show_tabs_button = false
show_actions_button = false
suggest_search_engines = false
suggest_quick_actions = false
suggest_top_sites = false

[search]
default_engine = "Startpage"

[translations]
never_translate = ["dutch"]

[navigation]
backspace = "back"

[video]
picture_in_picture = false

[websites]
serial_ports = true

[ublock_origin]
trust_my_filters = true

[css]
text = '''
#tabs-newtab-button,
.tabs-newtab-button,
#TabsToolbar .new-tab-button,
#vertical-tabs .new-tab-button,
#sidebar-main .new-tab-button,
#vertical-tabs-newtab-button,
[data-l10n-id="tabs-toolbar-new-tab"],
[data-l10n-id="newtab-button-label"],
.tabbrowser-arrowscrollbox-periphery,
#alltabs-button {
  display: none !important;
}
'''

[bookmarks.menu]
Bazarr = "https://bazarr.vdijk.be"
Docker = "https://docker.vdijk.be"
Frigate = "https://frigate.vdijk.be"
"Home Assistant" = "https://ha.vdijk.be"
"Homelab startpage" = "https://home.vdijk.be"
Immich = "https://immich.vdijk.be"
Jellyfin = "https://jellyfin.vdijk.be"
"Jorisvandijk.com" = "https://jorisvandijk.com"
Lidarr = "https://lidarr.vdijk.be"
Navidrome = "https://navidrome.vdijk.be"
"Nginx Proxy Manager" = "https://npm.vdijk.be"
PiHole = "https://pihole.vdijk.be/admin"
Prowlarr = "https://prowlarr.vdijk.be"
Proxmox = "https://proxmox.vdijk.be"
"Proxmox Backup Server" = "https://pbs.vdijk.be"
qBittorrent = "https://qbittorrent.vdijk.be"
Radarr = "https://radarr.vdijk.be"
RomM = "https://romm.vdijk.be"
SABnzbd = "https://sabnzbd.vdijk.be"
Seerr = "https://seerr.vdijk.be"
Sonarr = "https://sonarr.vdijk.be"
Tidarr = "https://tidarr.vdijk.be"
WireGuard = "https://wireguard.vdijk.be"

[search_engines]
Startpage = { address = "https://www.startpage.com/search?q=%s", keyword = "@sp" }

[ublock_origin.filters]
"Google login prompts" = '||accounts.google.com/gsi/iframe/*'
"Startpage ad nag" = [
  'www.startpage.com##.css-13k8eon',
  'eu.startpage.com##.css-q66hc5',
  'eu.startpage.com##.css-34zzm5',
]
"YouTube hamburger menu" = 'www.youtube.com###masthead #guide-button'
"YouTube homepage feed" = [
  'www.youtube.com##ytd-browse[page-subtype="home"] #contents',
  'www.youtube.com##ytd-browse[page-subtype="home"] ytd-rich-grid-renderer',
]
"YouTube left sidebar" = [
  'www.youtube.com##ytd-guide-renderer',
  'www.youtube.com##tp-yt-app-drawer',
  'www.youtube.com##ytd-mini-guide-renderer',
]
"YouTube merch shelf" = 'www.youtube.com##ytd-merch-shelf-renderer'
"YouTube right three-dot menu" = 'www.youtube.com###masthead #button'
"YouTube sign in" = 'www.youtube.com##ytd-button-renderer:has-text(Sign in)'
"YouTube slowdown toast" = 'www.youtube.com##.paper-toast-open.yt-notification-action-renderer.style-scope.toast-button'
"YouTube video suggestions pane" = 'www.youtube.com##ytd-watch-next-secondary-results-renderer'
"YouTube voice search" = 'www.youtube.com###voice-search-button'
