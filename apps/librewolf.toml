[user_chrome]
text = '''
#tabs-newtab-button,
.tabs-newtab-button,
#TabsToolbar .new-tab-button,
#vertical-tabs .new-tab-button,
#sidebar-main .new-tab-button,
#vertical-tabs-newtab-button,
[data-l10n-id="tabs-toolbar-new-tab"],
[data-l10n-id="newtab-button-label"],
.tabbrowser-arrowscrollbox-periphery,
#alltabs-button {
  display: none !important;
}
'''

[policies]
EnterprisePoliciesEnabled = true

[policies.ExtensionSettings."uBlock0@raymondhill.net"]
installation_mode = "force_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"

[policies.ExtensionSettings."{73a6fe31-595d-460b-a920-fcc0f8843232}"]
installation_mode = "force_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/noscript/latest.xpi"

[policies.ExtensionSettings."sponsorBlocker@ajay.app"]
installation_mode = "force_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/sponsorblock/latest.xpi"

[policies.ExtensionSettings."idcac-pub@guus.ninja"]
installation_mode = "force_installed"
install_url = "https://addons.mozilla.org/firefox/downloads/latest/istilldontcareaboutcookies/latest.xpi"

[policies.SearchEngines]
Default = "Startpage"

[[policies.SearchEngines.Add]]
Name = "Startpage"
URLTemplate = "https://www.startpage.com/search?q={searchTerms}"
Method = "GET"
IconURL = "https://www.startpage.com/favicon.ico"
Alias = "@sp"

[policies."3rdparty".Extensions."uBlock0@raymondhill.net"]
userSettings = [["userFiltersTrusted", "true"]]

