[font]
family = "CaskaydiaCove Nerd Font Mono"
size_pt = 14

[colors]
text = { fg = "#f8f8f2", bg = "#282a36" }
selection = { fg = "#ffffff", bg = "#44475a" }
cursor = "#f8f8f2"
links = "#8be9fd"
active_tab = { fg = "#282a36", bg = "#f8f8f2" }
inactive_tab = { fg = "#282a36", bg = "#6272a4" }
mark = { fg = "#282a36", bg = "#ff5555" }

[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"

[colors.bright]
black = "#6272a4"
red = "#ff6e6e"
green = "#69ff94"
yellow = "#ffffa5"
blue = "#d6acff"
magenta = "#ff92df"
cyan = "#a4ffff"
white = "#ffffff"

[window]
layouts = ["splits"]
margin_pt = 4
focus_follows_mouse = true
scrollback_lines = 100000
confirm_close = "when_running"

[shortcuts]
previous_tab = ["cmd+h", "cmd+j"]
next_tab = ["cmd+l", "cmd+k"]
split_window = "cmd+b"
close_window = "cmd+w"

[bell]
sound = false
