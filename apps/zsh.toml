[environment]
EDITOR = "micro"
VISUAL = "micro"
COLORTERM = "truecolor"
HOMEBREW_NO_ANALYTICS = "1"
HOMEBREW_NO_ASK = "1"
HOMEBREW_NO_ENV_HINTS = "1"
_ZO_DOCTOR = "0"

[homebrew]
shellenv = true

[path]
prepend = ["$HOME/git/scripts", "$HOME/.local/bin", "$HOME/go/bin"]

[plugins]
autosuggestions = true
syntax_highlighting = true
fzf = true
zoxide = true
zoxide_options = ["--cmd", "cd"]
kitty_integration = true

[options]
hist_verify = true
prompt_subst = true

[source]
files = ["$HOME/git/scripts/j.zsh"]

[prompt]
text = '''

%F{green}┌──(%f%F{135}%~%F{green})%f$(git_status_prompt)
%F{green}└─%f%(?,%F{135}λ%f,%F{red}✘%f) '''

[functions]
cl = 'cd "$@" && command ls'
fcd = 'cd "$(\ls -d */ | fzf)"'
gc = 'git commit -m "$*"'
git_status_prompt = '''
local st
st=$(git --no-optional-locks status --porcelain 2>/dev/null) || return
case $st in
  ('') echo " %F{green}✓%f" ;;
  ((|*$'\n')(DD|AU|UD|UA|DU|AA|UU)*) echo " %F{red}●%f" ;;
  (*) echo " %F{yellow}✘%f" ;;
esac
'''
h = '''
local cmd
cmd=$( ( fc -l -n 1 -1 || fc -l -n ) | fzf --tac --no-sort)
[ -n "$cmd" ] && print -z "$cmd"
'''

[history]
size = 200000
save = 200000
ignore_dups = true
save_no_dups = true
expire_dups_first = true
ignore_space = true

[aliases]
".." = "cd .."
c = "clear"
cat = "bat"
eject = "jEject"
ex = "jExtract"
ga = "git add -A"
gd = "git diff --color=always"
gp = "git push"
grep = "grep --color=auto"
gs = "git status"
hn = "jHugoHelper new"
hm = "jHugoHelper microblog"
hs = "jHugoHelper server"
homelab = "ssh -t root@192.168.1.5"
homelab-tmux = 'ssh -t root@192.168.1.5 "tmux attach || tmux new -s main"'
la = "jList -a"
ls = "jList"
lsblk = "diskutil list"
m = "micro"
mpv = "/Applications/mpv.app/Contents/MacOS/mpv"
n = "newsboat"
newrepo = "jNewRepo"
o = "jOpenFZF"
optiplex = "ssh -t joris@192.168.1.100"
push = "jPush"
repos = "jRepos"
s = "jFindApp"
space = 'du -sh "${1:-.}"'
u = "malum run && brew upgrade"
w = "curl wttr.in"
x = "chmod +x"

[abbreviations]
copy = "rsync -a --no-owner --partial --info=progress2 -e ssh"
symlink = "ln -s"

[global_abbreviations]
data = "root@192.168.1.5:/data/"
pc = "|pbcopy"
srv = "root@192.168.1.5:/data/"
