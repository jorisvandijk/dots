[settings]
browser = "open -a 'LibreWolf' %u"
auto-reload = true
reload-time = 60
reload-threads = 10
reload-only-visible-feeds = false
refresh-on-startup = true
download-path = "~/Downloads/newsboat/%n"
max-downloads = 4
articlelist-format = "%4i %f %D  %?T?|%-17T| ?%t"
feedlist-format = "%4i %n %11u %t"
datetime-format = "%b %d"
feed-sort-order = "lastupdated"
show-read-feeds = true
show-read-articles = true
cleanup-on-quit = true
confirm-exit = false
notify-program = "terminal-notifier -title 'Newsboat' -message"
notify-always = true
notify-screen = true

[keybindings]
j = "down"
k = "up"
J = "next-feed articlelist"
K = "prev-feed articlelist"
G = "end"
g = "home"
l = "open"
h = "quit"

[ignore_articles]
"*" = 'link =~ "/shorts/"'

