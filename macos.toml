[preferences.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleAccentColor = 6 # pink
AppleShowScrollBars = "WhenScrolling"
_HIHideMenuBar = true
AppleMenuBarVisibleInFullscreen = false
CGDisableCursorLocationMagnification = true # no shake to find the pointer
InitialKeyRepeat = 30
KeyRepeat = 2
NSAutomaticCapitalizationEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticSpellingCorrectionEnabled = false
"com.apple.swipescrolldirection" = false # natural scrolling off
"com.apple.trackpad.forceClick" = false
"com.apple.sound.beep.volume" = 0
"com.apple.sound.uiaudio.enabled" = false

[preferences."com.apple.BezelServices"]
dAuto = false # keyboard backlight in low light

[preferences."com.apple.AppleMultitouchTrackpad"]
Clicking = true
TrackpadThreeFingerDrag = true

[preferences."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = true
TrackpadThreeFingerDrag = true

[preferences."com.apple.finder"]
AppleShowAllExtensions = true
FXDefaultSearchScope = "SCcf" # current folder
FXEnableExtensionChangeWarning = false
FXPreferredViewStyle = "Nlsv" # list
FXRemoveOldTrashItems = true
NewWindowTarget = "PfHm" # home
QuitMenuItem = true
ShowHardDrivesOnDesktop = false
ShowExternalHardDrivesOnDesktop = false
ShowRemovableMediaOnDesktop = false
ShowPathbar = true
ShowStatusBar = true

[preferences."com.apple.dock"]
autohide = true
autohide-delay = 1000.0 # never slides in
autohide-time-modifier = 0.0

[preferences."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[preferences."com.apple.screencapture"]
location = "/Users/joris/Documents"
target = "clipboard"

[preferences."com.apple.screensaver"]
askForPassword = true
askForPasswordDelay = 0

[preferences."com.apple.menuextra.clock"]
ShowAMPM = false
ShowDayOfWeek = true

[preferences."com.apple.TextInputMenu"]
visible = false

[current_host."com.apple.controlcenter"]
Timer = 8 # hidden

[preferences."com.apple.WindowManager"]
GloballyEnabled = false # Stage Manager
EnableStandardClickToShowDesktop = false
EnableTiledWindowMargins = false
StandardHideDesktopIcons = true
StandardHideWidgets = true

[preferences."com.apple.assistant.support"]
"Assistant Enabled" = false

[preferences."com.apple.Siri"]
StatusMenuVisible = false
VoiceTriggerUserEnabled = false

[preferences."com.apple.gamed"]
GKOptedOutOfGameCenter = true

[default_apps]
browser = "net.librewolf.librewolf"
video = "io.mpv"

[sudo]
touch_id = true

[computer]
hostname = "macbook"
boot_sound = false

[power.battery]
lessbright = 0

[apple_apps]
remove = ["GarageBand", "iMovie", "Keynote", "Numbers", "Pages"]

