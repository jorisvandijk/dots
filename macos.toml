[appearance]
mode = "dark"
accent_color = "pink"
scroll_bars = "when_scrolling"

[menu_bar]
show = "never"
show_spotlight = false
show_now_playing = false
show_timer = false
show_input_menu = false

[clock]
show_am_pm = false
show_day_of_week = true

[sound]
alert_volume_percent = 0
ui_sounds = false

[pointer]
natural_scrolling = false
shake_to_locate = false

[trackpad]
tap_to_click = true
three_finger_drag = true
force_click = false

[keyboard]
repeat_delay_ms = 450
repeat_interval_ms = 30
auto_backlight = false
input_sources = ["us"]

[text]
auto_correct = false
auto_capitalize = false
auto_period = false
smart_dashes = false
smart_quotes = false

[finder]
show_extensions = true
warn_on_extension_change = false
search_scope = "current_folder"
view = "list"
new_window = "home"
empty_old_trash = true
quit_menu_item = true
show_path_bar = true
show_status_bar = true
write_ds_store_on_network = false
write_ds_store_on_usb = false

[desktop]
show_hard_drives = false
show_external_drives = false
show_removable_media = false
show_icons = false
show_widgets = false
click_to_show = false
stage_manager = false

[dock]
show = "never"
pinned_apps = []
pinned_folders = []

[screen_capture]
folder = "$HOME/Documents"
save_to = "clipboard"

[siri]
enabled = false

[game_center]
enabled = false

[screen_lock]
delay_seconds = 0

[default_apps]
browser = "net.librewolf.librewolf"
video = "io.mpv"

[sudo]
touch_id = true

[computer]
hostname = "macbook"
boot_sound = false

[display]
resolution = "1710x1112"

[power.battery]
dim_screen = false

[apple_apps]
remove = ["GarageBand", "iMovie", "Keynote", "Numbers", "Pages"]

