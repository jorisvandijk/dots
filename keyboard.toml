[hyper]
key = "left_option"

[remaps]
grave = "delete_forward"
non_us_backslash = "grave"
fn = "left_control"
left_control = "fn"
caps_lock = "escape"

[shortcuts]
"hyper+b" = "com.bitwarden.desktop"
"hyper+comma" = "stack_previous"
"hyper+d" = "com.hnc.Discord"
"hyper+down" = "split_shorter"
"hyper+e" = "com.apple.mail"
"hyper+f" = "com.apple.finder"
"hyper+g" = "org.gimp.gimp"
"hyper+h" = "io.robbie.HomeAssistant"
"hyper+i" = "inspect_window"
"hyper+l" = "toggle_stack"
"hyper+left" = "split_left"
"hyper+n" = "com.apple.Notes"
"hyper+period" = "stack_next"
"hyper+return" = "net.kovidgoyal.kitty"
"hyper+right" = "split_right"
"hyper+space" = "launcher"
"hyper+t" = "toggle_float"
"hyper+up" = "split_taller"
"hyper+v" = "com.vscodium"
"hyper+w" = "net.librewolf.librewolf"
"ctrl+cmd+h" = "clipboard"
