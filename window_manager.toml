[windows]
frame = "visible"
allow_hide_minimize = false

[floating_windows.password_prompts]
app = "com.apple.SecurityAgent"

[floating_windows.open_and_save_dialogs]
app = "com.apple.appkit.xpc.openAndSavePanelService"

[floating_windows.system_alerts]
app = "com.apple.coreservices.uiagent"

[floating_windows.archive_utility]
app = "com.apple.archiveutility"

[floating_windows.gimp_dialogs]
app = "org.gimp.gimp"
title = "^(Open|Export|Import|Save|Overwrite)"

[floating_windows.finder_progress]
app = "com.apple.finder"
title = "^(Copy|Move|Delete|Compress)$"

[floating_windows.markedit_settings]
app = "app.cyan.markedit"
title = "^(Editor|Assistant|General|Window|Extensions)$"
